<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MH Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0b0b0e;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
            padding: 8px;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 100, 0.08);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px 12px;
            box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .chat-container {
                max-height: 100vh;
                border-radius: 16px;
                padding: 10px 10px 10px;
            }
            body {
                padding: 4px;
            }
        }

        @media (max-height: 700px) {
            .chat-container {
                max-height: 100vh;
                border-radius: 16px;
            }
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 100, 0.06);
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: #0b0b0e;
            flex-shrink: 0;
        }

        .chat-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: #f5efe6;
            flex: 1;
        }

        .chat-title .highlight {
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chat-title small {
            display: block;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-weight: 300;
            font-size: 0.55rem;
            color: #b0a99b;
            -webkit-text-fill-color: #b0a99b;
        }

        .chat-status {
            background: rgba(245, 176, 66, 0.1);
            border: 1px solid rgba(245, 176, 66, 0.1);
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.5rem;
            color: #f5b042;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .chat-status i {
            font-size: 0.4rem;
            color: #4caf50;
            animation: pulseDot 1.5s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.6);
            }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 2px;
            min-height: 0;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 3px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 100, 0.2);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            animation: msgIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            flex-shrink: 0;
        }

        .message.bot {
            flex-direction: row;
        }
        .message.user {
            flex-direction: row-reverse;
        }

        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .avatar {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 100, 0.06);
            color: #b0a99b;
        }

        .message.bot .avatar {
            background: rgba(245, 176, 66, 0.12);
            color: #f5b042;
            border-color: rgba(245, 176, 66, 0.1);
        }

        .message.user .avatar {
            background: rgba(255, 255, 255, 0.06);
            color: #eaeef2;
        }

        .message .bubble {
            max-width: 85%;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            line-height: 1.7;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.06);
            color: #d6d0c4;
        }

        .message.bot .bubble {
            background: rgba(255, 215, 100, 0.04);
            border-color: rgba(255, 215, 100, 0.08);
            border-top-right-radius: 4px;
        }

        .message.user .bubble {
            background: rgba(245, 176, 66, 0.08);
            border-color: rgba(245, 176, 66, 0.12);
            border-top-left-radius: 4px;
            color: #f5efe6;
        }

        .message .bubble strong {
            color: #f5b042;
        }
        .message .bubble i {
            color: #f5b042;
            margin-left: 2px;
        }
        .message .bubble .highlight-text {
            color: #f5b042;
            font-weight: 700;
        }

        .message .bubble .site-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.08);
            border-radius: 10px;
            padding: 6px 8px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message .bubble .site-card .site-img {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            object-fit: cover;
            background: #0b0b0e;
            flex-shrink: 0;
        }

        .message .bubble .site-card .site-info {
            flex: 1;
            min-width: 50px;
        }

        .message .bubble .site-card .site-info .site-name {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            color: #f5efe6;
            font-size: 0.75rem;
        }

        .message .bubble .site-card .site-info .site-desc {
            font-size: 0.6rem;
            color: #b0a99b;
        }

        .message .bubble .site-card .site-link {
            color: #f5b042;
            text-decoration: none;
            font-size: 0.55rem;
            font-weight: 600;
            padding: 2px 10px;
            border: 1px solid rgba(245, 176, 66, 0.15);
            border-radius: 40px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }

        .message .bubble .site-card .site-link:hover {
            background: rgba(245, 176, 66, 0.08);
            border-color: #f5b042;
        }

        .message .bubble .design-mini {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 8px;
            padding: 4px 8px;
            margin: 3px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message .bubble .design-mini .d-icon {
            font-size: 0.9rem;
            color: #f5b042;
        }

        .message .bubble .design-mini .d-name {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            color: #f5efe6;
            font-size: 0.7rem;
        }

        .message .bubble .design-mini .d-desc {
            font-size: 0.55rem;
            color: #b0a99b;
        }

        .social-links {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .social-links a {
            color: #f5b042;
            text-decoration: none;
            background: rgba(255, 215, 100, 0.05);
            padding: 2px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 100, 0.1);
            font-size: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .social-links a:hover {
            background: rgba(245, 176, 66, 0.1);
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .quick-replies button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.08);
            color: #b0a99b;
            padding: 3px 10px;
            border-radius: 40px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .quick-replies button i {
            color: #f5b042;
            font-size: 0.55rem;
        }

        .quick-replies button:hover {
            background: rgba(245, 176, 66, 0.08);
            border-color: rgba(245, 176, 66, 0.2);
            color: #f5efe6;
            transform: translateY(-2px);
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 60px;
            padding: 2px 2px 2px 12px;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .input-area:focus-within {
            border-color: rgba(245, 176, 66, 0.25);
            background: rgba(255, 255, 255, 0.04);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #eaeef2;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 0.8rem;
            padding: 8px 0;
            outline: none;
            min-width: 0;
        }

        .input-area input::placeholder {
            color: #5f5a50;
        }

        .input-area button {
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border: none;
            color: #0b0b0e;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        .input-area button:active {
            transform: scale(0.93);
        }

        .typing-indicator {
            display: none;
            padding: 3px 10px;
            background: rgba(255, 215, 100, 0.04);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 40px;
            color: #b0a99b;
            font-size: 0.6rem;
            align-self: flex-start;
            margin-bottom: 3px;
            flex-shrink: 0;
        }

        .typing-indicator i {
            color: #f5b042;
            animation: pulseIcon 1s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .typing-indicator.show {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 380px) {
            .chat-container {
                padding: 6px 6px 8px;
                border-radius: 12px;
            }
            .chat-title {
                font-size: 0.9rem;
            }
            .chat-avatar {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .message .bubble {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
            .quick-replies button {
                font-size: 0.5rem;
                padding: 2px 6px;
            }
            .input-area input {
                font-size: 0.7rem;
                padding: 6px 0;
            }
            .input-area button {
                width: 32px;
                height: 32px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">

        <div class="chat-header">
            <div class="chat-avatar">M</div>
            <div class="chat-title">
                <span class="highlight">MH Assistant</span>
                <small><i class="fas fa-robot"></i> پردازش کامل کلمات</small>
            </div>
            <div class="chat-status">
                <i class="fas fa-circle"></i> آنلاین
            </div>
        </div>

        <div class="messages" id="messagesBox">
            <div class="message bot">
                <div class="avatar"><i class="fas fa-robot"></i></div>
                <div class="bubble">
                    <i class="fas fa-hand-peace"></i> سلام! من <strong>MH Assistant</strong> هستم.<br>
                    <strong>هر چیزی</strong> بپرسی، کلمه به کلمه پردازش میکنم.<br>
                    <span style="color:#f5b042;font-size:0.7rem;">👇 هر جمله‌ای بنویس، میفهمم!</span>
                </div>
            </div>
        </div>

        <div class="quick-replies">
            <button onclick="askQuestion('لطفا بگو لینک اینستاگرام سازنده')"><i class="fab fa-instagram"></i> لینک اینستا</button>
            <button onclick="askQuestion('سلام چه سایت هایی ساختی؟')"><i class="fas fa-laptop-code"></i> سایت‌ها</button>
            <button onclick="askQuestion('کی هستی و چه کاره ای؟')"><i class="fas fa-question"></i> کی هستی؟</button>
            <button onclick="askQuestion('راه ارتباطی با تو چیه؟')"><i class="fas fa-share-alt"></i> ارتباط</button>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="هر چیزی بپرس..." autocomplete="off">
            <button onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </div>

    <script>
        // ============================================================
        //  دیتابیس
        // ============================================================
        const data = {
            name: 'mohamad hossein snti',
            job: 'توسعه‌دهنده وب و طراح گرافیک',
            startYear: '۱۴۰۳',
            skills: ['HTML', 'CSS', 'JavaScript', 'طراحی گرافیک', 'تولید محتوا', 'UI/UX', 'React', 'Node.js'],
            goal: 'ترکیب هنر و تکنولوژی برای خلق فضاهای دیجیتال خاص',
            bio: 'توسعه‌دهنده وب و طراح گرافیک از سال ۱۴۰۳',

            sites: [{
                name: 'ZEROX',
                desc: 'پلتفرم تخصصی گیم و اخبار',
                link: 'https://zeroxgame74-afk.github.io/zeroxgamee/',
                img: 'https://uploadkon.ir/uploads/511301_26Zerox-۱۲۱۲.jpg'
            }, {
                name: 'کالفود',
                desc: 'پلتفرم سفارش غذای لذیذ',
                link: 'https://zeroxgame74-afk.github.io/call-food.ir/',
                img: 'https://uploadkon.ir/uploads/481d01_26call-food-۱۲۱۲۳.jpg'
            }, {
                name: 'کوروش گیم',
                desc: 'فروشگاه اکانت گیم',
                link: 'https://zeroxgame74-afk.github.io/Kourosh-Game.ir/',
                img: 'https://uploadkon.ir/uploads/d66b01_26Kourosh-Gameir۱۲.jpg'
            }],

            designs: [
                { name: 'گفتند زلف یار...', desc: 'ادای احترام به نام علی (ع)' },
                { name: 'اهواز... خاک غسل‌شده', desc: 'یاد شهدای جنوب ایران' }
            ],

            apps: 'در حال توسعه',

            social: {
                telegram: 'https://t.me/@mohamad_hossein_ev18',
                instagram: 'https://www.instagram.com/mohamad_hossein_ev18'
            }
        };

        // ============================================================
        //  موتور پردازش کامل کلمات (هوشمند)
        // ============================================================
        function getReply(input) {
            const text = input.trim();
            const lower = text.toLowerCase();

            if (!text) {
                return `چیزی ننوشتی! یه سوال بپرس.`;
            }

            // ===== مرحله 1: شکستن به کلمات =====
            const words = lower.split(/\s+/);

            // ===== مرحله 2: تشخیص کلمات کلیدی =====
            let found = {
                identity: false,
                site: false,
                design: false,
                skill: false,
                social: false,
                app: false,
                greeting: false,
                feeling: false,
                thank: false,
                link: false,
                instagram: false,
                telegram: false,
                creator: false,
                all: false,
                help: false
            };

            const keywords = {
                identity: ['کی', 'هستی', 'کیا', 'چه کسی', 'تو کی', 'هستید', 'کیایی'],
                site: ['سایت', 'وب', 'پروژه', 'لینک', 'zerox', 'کالفود', 'کوروش', 'گیم', 'نمونه کار', 'آدرس', 'ساختی', 'چی ساختی',
                    'کارها'
                ],
                design: ['طراحی', 'گرافیک', 'هنری', 'عکس', 'تصویر', 'یا علی', 'اهواز', 'شهید', 'پالت', 'نقاشی', 'اثر', 'هنر'],
                skill: ['مهارت', 'توانایی', 'بلد', 'تخصص', 'چه چیزایی', 'یاد', 'چه کارهایی', 'چی بلدی'],
                social: ['تلگرام', 'اینستاگرام', 'شبکه', 'اجتماعی', 'تماس', 'ارتباط', 'پیام', 'آیدی', 'کانال', 'راه', 'سوشال'],
                app: ['برنامه', 'اپ', 'نرم', 'افزار', 'ابزار', 'اپلیکیشن', 'موبایل', 'اندروید'],
                greeting: ['سلام', 'درود', 'هی', 'الو', 'هلو', 'صبح', 'عصر', 'شب', 'بخیر'],
                feeling: ['خوب', 'چطوری', 'حالت', 'اوضاع', 'خبر', 'چی می‌کنی', 'خوشی', 'چه خبر'],
                thank: ['ممنون', 'مرسی', 'متشکرم', 'دمت گرم', 'دستت', 'تشکر', 'سپاس'],
                link: ['لینک', 'آدرس', 'url', 'لینکش'],
                instagram: ['اینستا', 'اینستاگرام', 'insta', 'instagram'],
                telegram: ['تلگرام', 'telegram', 'تلگر'],
                creator: ['سازنده', 'صاحب', 'مالک', 'ساخت', 'ساخته', 'سازندش'],
                all: ['همه', 'تمام', 'لیست', 'همش'],
                help: ['راهنمایی', 'کمک', 'لطفا', 'میشه', 'بگو', 'بگید']
            };

            words.forEach(word => {
                for (const [topic, kws] of Object.entries(keywords)) {
                    if (kws.some(kw => word.includes(kw) || kw.includes(word))) {
                        found[topic] = true;
                    }
                }
            });

            // ===== مرحله 3: ساخت پاسخ بر اساس کلمات تشخیص داده شده =====

            // ---- اگر اینستاگرام و لینک و سازنده رو گفت ----
            if (found.instagram && found.link && found.creator) {
                return `
              <i class="fab fa-instagram" style="color:#f5b042;"></i> <strong>لینک اینستاگرام سازنده:</strong><br>
              <a href="${data.social.instagram}" target="_blank" style="color:#f5b042;text-decoration:underline;">${data.social.instagram}</a><br>
              <span style="color:#b0a99b;font-size:0.7rem;">👤 سازنده: <strong>${data.name}</strong></span>
            `;
            }

            // ---- اگر اینستاگرام رو گفت ----
            if (found.instagram || found.social) {
                let reply = `<i class="fab fa-instagram" style="color:#f5b042;"></i> <strong>اینستاگرام:</strong><br>`;
                reply += `<a href="${data.social.instagram}" target="_blank" style="color:#f5b042;text-decoration:underline;">${data.social.instagram}</a>`;
                if (found.creator || text.includes('سازنده')) {
                    reply += `<br><span style="color:#b0a99b;font-size:0.7rem;">👤 سازنده: <strong>${data.name}</strong></span>`;
                }
                return reply;
            }

            // ---- اگر تلگرام رو گفت ----
            if (found.telegram) {
                let reply = `<i class="fab fa-telegram-plane" style="color:#f5b042;"></i> <strong>تلگرام:</strong><br>`;
                reply += `<a href="${data.social.telegram}" target="_blank" style="color:#f5b042;text-decoration:underline;">${data.social.telegram}</a>`;
                if (found.creator || text.includes('سازنده')) {
                    reply += `<br><span style="color:#b0a99b;font-size:0.7rem;">👤 سازنده: <strong>${data.name}</strong></span>`;
                }
                return reply;
            }

            // ---- اگر کی هستی + هر چیز دیگه ----
            if (found.identity) {
                let reply = `<i class="fas fa-robot"></i> <strong>من ربات دستیار MH Assistant هستم!</strong><br>`;
                reply += `ساخته‌شده توسط <strong>${data.name}</strong><br>`;
                reply += `${data.job} از سال ${data.startYear}`;

                if (found.site) {
                    reply += `<br><br><i class="fas fa-laptop-code"></i> سایت‌ها: ${data.sites.map(s => s.name).join('، ')}`;
                }
                if (found.skill) {
                    reply += `<br><br><i class="fas fa-code"></i> مهارت‌ها: ${data.skills.join('، ')}`;
                }
                if (found.social) {
                    reply += `<br><br><i class="fas fa-share-alt"></i> اینستاگرام: ${data.social.instagram}`;
                }
                return reply;
            }

            // ---- اگر سایت‌ها ----
            if (found.site) {
                let reply = `<i class="fas fa-laptop-code"></i> <strong>سایت‌های ${data.name}:</strong><br>`;
                data.sites.forEach(s => {
                    reply += `
                <div class="site-card">
                  <img class="site-img" src="${s.img}" onerror="this.style.display='none'">
                  <div class="site-info">
                    <div class="site-name">${s.name}</div>
                    <div class="site-desc">${s.desc}</div>
                  </div>
                  <a href="${s.link}" target="_blank" class="site-link">
                    <i class="fas fa-external-link-alt"></i> مشاهده
                  </a>
                </div>
              `;
                });
                if (found.creator || text.includes('سازنده')) {
                    reply += `<br><span style="color:#b0a99b;font-size:0.7rem;">👤 سازنده: <strong>${data.name}</strong></span>`;
                }
                return reply;
            }

            // ---- اگر طراحی‌ها ----
            if (found.design) {
                let reply = `<i class="fas fa-palette"></i> <strong>طراحی‌های ${data.name}:</strong><br>`;
                data.designs.forEach(d => {
                    reply += `
                <div class="design-mini">
                  <div class="d-icon"><i class="fas fa-paint-brush"></i></div>
                  <div>
                    <div class="d-name">${d.name}</div>
                    <div class="d-desc">${d.desc}</div>
                  </div>
                </div>
              `;
                });
                return reply;
            }

            // ---- اگر مهارت‌ها ----
            if (found.skill) {
                let reply = `<i class="fas fa-code"></i> <strong>مهارت‌های ${data.name}:</strong><br>`;
                data.skills.forEach(s => {
                    reply += `🔹 ${s}<br>`;
                });
                return reply;
            }

            // ---- اگر برنامه‌ها ----
            if (found.app) {
                return `<i class="fas fa-puzzle-piece"></i> برنامه‌ها: ${data.apps}`;
            }

            // ---- اگر همه رو خواست ----
            if (found.all || text.includes('همه چیز') || text.includes('کامل')) {
                return `
              <i class="fas fa-robot"></i> <strong>همه چیز درباره ${data.name}:</strong><br><br>
              <i class="fas fa-user-astronaut"></i> <strong>معرفی:</strong> ${data.job} از سال ${data.startYear}<br>
              <i class="fas fa-heart" style="color:#f5b042;"></i> <strong>هدف:</strong> ${data.goal}<br><br>
              <i class="fas fa-laptop-code"></i> <strong>سایت‌ها:</strong> ${data.sites.map(s => s.name).join('، ')}<br>
              <i class="fas fa-palette"></i> <strong>طراحی‌ها:</strong> ${data.designs.map(d => d.name).join('، ')}<br>
              <i class="fas fa-code"></i> <strong>مهارت‌ها:</strong> ${data.skills.join('، ')}<br>
              <i class="fab fa-instagram"></i> <strong>اینستاگرام:</strong> ${data.social.instagram}
            `;
            }

            // ---- اگر سلام ----
            if (found.greeting) {
                let reply = `<i class="fas fa-hand-peace"></i> سلام! خوش اومدی به <strong>MH Assistant</strong>.`;
                if (found.help) {
                    reply += `<br><span style="color:#b0a99b;font-size:0.7rem;">هر چیزی بپرس، پردازش میکنم!</span>`;
                }
                return reply;
            }

            // ---- اگر احوالپرسی ----
            if (found.feeling) {
                return `<i class="fas fa-smile"></i> ممنون! من <strong>MH Assistant</strong> هستم و عالی‌ام.`;
            }

            // ---- اگر تشکر ----
            if (found.thank) {
                return `<i class="fas fa-heart" style="color:#f5b042;"></i> خواهش می‌کنم! خوشحالم که کمک کردم.`;
            }

            // ---- اگر درخواست کمک ----
            if (found.help) {
                return `
              <i class="fas fa-robot"></i> <strong>چطور می‌تونم کمک کنم؟</strong><br>
              می‌تونی از اینا بپرسی:<br>
              <span style="color:#f5b042;">کی هستی؟</span> • <span style="color:#f5b042;">سایت‌ها</span> • <span style="color:#f5b042;">طراحی‌ها</span> • <span style="color:#f5b042;">مهارت‌ها</span> • <span style="color:#f5b042;">اینستاگرام</span>
            `;
            }

            // ===== پاسخ پیش‌فرض (هر چیزی که تشخیص نداد) =====
            return `
            <i class="fas fa-robot"></i> <strong>من MH Assistant هستم!</strong><br>
            جمله "<strong>${text}</strong>" رو کلمه به کلمه پردازش کردم.<br><br>
            کلماتی که تشخیص دادم:<br>
            <span style="color:#f5b042;font-size:0.7rem;">
              ${words.map(w => `"${w}"`).join(' • ')}
            </span><br><br>
            می‌تونی از اینا بپرسی:<br>
            <span style="color:#f5b042;">کی هستی؟</span> • <span style="color:#f5b042;">سایت‌ها</span> • <span style="color:#f5b042;">طراحی‌ها</span> • <span style="color:#f5b042;">مهارت‌ها</span> • <span style="color:#f5b042;">اینستاگرام</span>
          `;
        }

        // ============================================================
        //  توابع
        // ============================================================
        const messagesBox = document.getElementById('messagesBox');
        const userInput = document.getElementById('userInput');
        let isTyping = false;

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isTyping) return;

            addMessage('user', text);
            userInput.value = '';
            userInput.focus();

            isTyping = true;
            showTyping();

            setTimeout(() => {
                hideTyping();
                const reply = getReply(text);
                addMessage('bot', reply);
                isTyping = false;
            }, 500);
        }

        function askQuestion(text) {
            userInput.value = text;
            sendMessage();
        }

        function addMessage(type, content) {
            const div = document.createElement('div');
            div.className = `message ${type}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = type === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = content;

            div.appendChild(avatar);
            div.appendChild(bubble);
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function showTyping() {
            let typing = document.querySelector('.typing-indicator');
            if (!typing) {
                typing = document.createElement('div');
                typing.className = 'typing-indicator';
                typing.innerHTML = '<i class="fas fa-robot"></i> در حال پردازش کلمات...';
                messagesBox.appendChild(typing);
            }
            typing.classList.add('show');
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function hideTyping() {
            const typing = document.querySelector('.typing-indicator');
            if (typing) typing.classList.remove('show');
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('load', function() {
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });
    </script>

</body>
</html>
