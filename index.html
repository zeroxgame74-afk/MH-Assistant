<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MH Assistant | دستیار هوشمند</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0b0b0e;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
            padding: 8px;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 100, 0.08);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px 12px;
            box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        @media (max-width: 480px) {
            .chat-container {
                max-height: 100vh;
                border-radius: 16px;
                padding: 10px 10px 10px;
            }
            body {
                padding: 4px;
            }
        }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 100, 0.06);
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .chat-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: #0b0b0e;
            flex-shrink: 0;
        }
        .chat-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: #f5efe6;
            flex: 1;
        }
        .chat-title .highlight {
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chat-title small {
            display: block;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-weight: 300;
            font-size: 0.55rem;
            color: #b0a99b;
            -webkit-text-fill-color: #b0a99b;
        }
        .chat-status {
            background: rgba(245, 176, 66, 0.1);
            border: 1px solid rgba(245, 176, 66, 0.1);
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.5rem;
            color: #f5b042;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .chat-status i {
            font-size: 0.4rem;
            color: #4caf50;
            animation: pulseDot 1.5s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.6);
            }
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 2px;
            min-height: 0;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar {
            width: 3px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 100, 0.2);
            border-radius: 10px;
        }
        .message {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            animation: msgIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            flex-shrink: 0;
        }
        .message.bot {
            flex-direction: row;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message .avatar {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 100, 0.06);
            color: #b0a99b;
        }
        .message.bot .avatar {
            background: rgba(245, 176, 66, 0.12);
            color: #f5b042;
            border-color: rgba(245, 176, 66, 0.1);
        }
        .message.user .avatar {
            background: rgba(255, 255, 255, 0.06);
            color: #eaeef2;
        }
        .message .bubble {
            max-width: 85%;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            line-height: 1.9;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.06);
            color: #d6d0c4;
        }
        .message.bot .bubble {
            background: rgba(255, 215, 100, 0.04);
            border-color: rgba(255, 215, 100, 0.08);
            border-top-right-radius: 4px;
        }
        .message.user .bubble {
            background: rgba(245, 176, 66, 0.08);
            border-color: rgba(245, 176, 66, 0.12);
            border-top-left-radius: 4px;
            color: #f5efe6;
        }
        .message .bubble strong {
            color: #f5b042;
        }
        .message .bubble i {
            color: #f5b042;
            margin-left: 2px;
        }

        .site-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.08);
            border-radius: 10px;
            padding: 6px 8px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .site-card .site-img {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            object-fit: cover;
            background: #0b0b0e;
            flex-shrink: 0;
        }
        .site-card .site-info {
            flex: 1;
            min-width: 50px;
        }
        .site-card .site-info .site-name {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            color: #f5efe6;
            font-size: 0.75rem;
        }
        .site-card .site-info .site-desc {
            font-size: 0.6rem;
            color: #b0a99b;
        }
        .site-card .site-link {
            color: #f5b042;
            text-decoration: none;
            font-size: 0.55rem;
            font-weight: 600;
            padding: 2px 10px;
            border: 1px solid rgba(245, 176, 66, 0.15);
            border-radius: 40px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }
        .site-card .site-link:hover {
            background: rgba(245, 176, 66, 0.08);
            border-color: #f5b042;
        }

        .design-mini {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 8px;
            padding: 4px 8px;
            margin: 3px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .design-mini .d-icon {
            font-size: 0.9rem;
            color: #f5b042;
        }
        .design-mini .d-name {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            color: #f5efe6;
            font-size: 0.7rem;
        }
        .design-mini .d-desc {
            font-size: 0.55rem;
            color: #b0a99b;
        }

        .social-links {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .social-links a {
            color: #f5b042;
            text-decoration: none;
            background: rgba(255, 215, 100, 0.05);
            padding: 2px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 100, 0.1);
            font-size: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .social-links a:hover {
            background: rgba(245, 176, 66, 0.1);
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .quick-replies button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.08);
            color: #b0a99b;
            padding: 3px 10px;
            border-radius: 40px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .quick-replies button i {
            color: #f5b042;
            font-size: 0.55rem;
        }
        .quick-replies button:hover {
            background: rgba(245, 176, 66, 0.08);
            border-color: rgba(245, 176, 66, 0.2);
            color: #f5efe6;
            transform: translateY(-2px);
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 60px;
            padding: 2px 2px 2px 12px;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .input-area:focus-within {
            border-color: rgba(245, 176, 66, 0.25);
            background: rgba(255, 255, 255, 0.04);
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #eaeef2;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 0.8rem;
            padding: 8px 0;
            outline: none;
            min-width: 0;
        }
        .input-area input::placeholder {
            color: #5f5a50;
        }
        .input-area button {
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border: none;
            color: #0b0b0e;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-area button:hover {
            transform: scale(1.05);
        }
        .input-area button:active {
            transform: scale(0.93);
        }

        .typing-indicator {
            display: none;
            padding: 3px 10px;
            background: rgba(255, 215, 100, 0.04);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 40px;
            color: #b0a99b;
            font-size: 0.6rem;
            align-self: flex-start;
            margin-bottom: 3px;
            flex-shrink: 0;
        }
        .typing-indicator i {
            color: #f5b042;
            animation: pulseIcon 1s ease-in-out infinite;
        }
        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
        .typing-indicator.show {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 215, 100, 0.12);
            border-radius: 20px;
            padding: 16px 20px;
            max-width: 400px;
            width: 92%;
            box-shadow: 0 24px 64px -16px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            z-index: 9999;
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            transition: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .notification.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(40px) scale(0.92);
            pointer-events: none;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(40px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }
        .notification .notif-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .notification .notif-header .icon-box {
            width: 40px;
            height: 40px;
            background: rgba(245, 176, 66, 0.12);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(245, 176, 66, 0.08);
        }
        .notification .notif-header .icon-box i {
            font-size: 1.3rem;
            color: #f5b042;
        }
        .notification .notif-header .title-group h3 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #f5efe6;
            margin: 0;
        }
        .notification .notif-header .title-group .version {
            font-size: 0.55rem;
            color: #f5b042;
            background: rgba(245, 176, 66, 0.08);
            padding: 0px 8px;
            border-radius: 40px;
            display: inline-block;
        }
        .notification .notif-body {
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 0.75rem;
            color: #c0b9ad;
            line-height: 1.9;
            padding-right: 4px;
        }
        .notification .notif-body ul {
            list-style: none;
            padding-right: 6px;
            margin: 4px 0;
        }
        .notification .notif-body ul li {
            padding-right: 18px;
            position: relative;
            font-size: 0.7rem;
        }
        .notification .notif-body ul li i {
            position: absolute;
            right: 0;
            top: 4px;
            color: #f5b042;
            font-size: 0.6rem;
        }
        .notification .notif-close {
            position: absolute;
            top: 10px;
            left: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #6f6a60;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notification .notif-close:hover {
            color: #f5efe6;
            background: rgba(255, 255, 255, 0.06);
            transform: rotate(90deg);
        }

        @media (max-width: 380px) {
            .chat-container {
                padding: 6px 6px 8px;
                border-radius: 12px;
            }
            .chat-title {
                font-size: 0.9rem;
            }
            .chat-avatar {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .message .bubble {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
            .quick-replies button {
                font-size: 0.5rem;
                padding: 2px 6px;
            }
            .input-area input {
                font-size: 0.7rem;
                padding: 6px 0;
            }
            .input-area button {
                width: 32px;
                height: 32px;
                font-size: 0.75rem;
            }
            .notification {
                padding: 12px 14px;
                max-width: 96%;
                bottom: 14px;
            }
        }

        /* استایل جستجو */
        .search-result {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 100, 0.1);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 4px;
        }
        .search-result .result-title {
            color: #f5b042;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .search-result .result-desc {
            color: #b0a99b;
            font-size: 0.75rem;
            line-height: 1.8;
        }
        .search-result .result-link {
            color: #f5b042;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }
        .search-result .result-link:hover {
            text-decoration: underline;
        }
        .search-result .result-error {
            color: #ff6b6b;
            font-size: 0.75rem;
        }
        .search-result .result-loading {
            color: #f5b042;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="chat-container">

        <div class="chat-header">
            <div class="chat-avatar">M</div>
            <div class="chat-title">
                <span class="highlight">MH Assistant</span>
                <small><i class="fas fa-robot"></i> دستیار خودمونی</small>
            </div>
            <div class="chat-status">
                <i class="fas fa-circle"></i> آنلاین
            </div>
        </div>

        <div class="messages" id="messagesBox">
            <div class="message bot">
                <div class="avatar"><i class="fas fa-robot"></i></div>
                <div class="bubble">
                    <i class="fas fa-hand-peace"></i> سلام داداش! <strong>MH Assistant</strong> هستم.<br>
                    <span style="color:#f5b042;">دستیار خودمونی</span> تو<br><br>
                    <span style="color:#b0a99b;font-size:0.7rem;">👇 هر چی بگی، جواب میدم! حتی میتونم برات تو اینترنت جستجو کنم!</span>
                </div>
            </div>
        </div>

        <div class="quick-replies">
            <button onclick="askQuestion('کی هستی؟')"><i class="fas fa-question"></i> کی هستی؟</button>
            <button onclick="askQuestion('سایت‌ها')"><i class="fas fa-laptop-code"></i> سایت‌ها</button>
            <button onclick="askQuestion('طراحی‌ها')"><i class="fas fa-palette"></i> طراحی‌ها</button>
            <button onclick="askQuestion('مهارت‌ها')"><i class="fas fa-code"></i> مهارت‌ها</button>
            <button onclick="askQuestion('لینک اینستاگرام')"><i class="fab fa-instagram"></i> اینستا</button>
            <button onclick="askQuestion('لینک تلگرام')"><i class="fab fa-telegram-plane"></i> تلگرام</button>
            <button onclick="askQuestion('فتوشاپ چیه؟')"><i class="fas fa-paint-brush"></i> فتوشاپ</button>
            <button onclick="askQuestion('حالت چطوره؟')"><i class="fas fa-smile"></i> حالت</button>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="هر چی دلت میخواد بپرس..." autocomplete="off">
            <button onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </div>

    <div class="notification" id="updateNotif">
        <button class="notif-close" onclick="closeNotification()"><i class="fas fa-times"></i></button>
        <div class="notif-header">
            <div class="icon-box">
                <i class="fas fa-gem"></i>
            </div>
            <div class="title-group">
                <h3>🎉 آپدیت جدید</h3>
                <span class="version">نسخه ۱۳.۰</span>
            </div>
        </div>
        <div class="notif-body">
            <ul>
                <li><i class="fas fa-check-circle"></i> موتور جستجوی ویکی‌پدیا</li>
                <li><i class="fas fa-check-circle"></i> جستجوی گوگل در صورت نیاز</li>
                <li><i class="fas fa-check-circle"></i> پاسخ‌های متنوع و جذاب</li>
                <li><i class="fas fa-check-circle"></i> تشخیص هوشمند سوالات</li>
            </ul>
        </div>
    </div>

    <script>
        // ============================================================
        //  نوتیفیکیشن
        // ============================================================
        const APP_VERSION = '13.0';
        const notif = document.getElementById('updateNotif');
        let notifTimer;

        function closeNotification() {
            notif.classList.add('hide');
            clearTimeout(notifTimer);
            setTimeout(() => {
                notif.style.display = 'none';
            }, 500);
        }

        const hasSeen = localStorage.getItem('mhs_notification_version');
        if (hasSeen !== APP_VERSION) {
            notif.style.display = 'block';
            notifTimer = setTimeout(() => {
                closeNotification();
            }, 10000);
            localStorage.setItem('mhs_notification_version', APP_VERSION);
        } else {
            notif.style.display = 'none';
        }

        // ============================================================
        //  دیتابیس اصلی
        // ============================================================
        const data = {
            name: 'mohamad hossein snti',
            job: 'توسعه‌دهنده وب و طراح گرافیک',
            startYear: '۱۴۰۳',
            skills: ['HTML', 'CSS', 'JavaScript', 'طراحی گرافیک', 'تولید محتوا', 'UI/UX', 'React', 'Node.js', 'Python', 'PHP'],

            sites: [{
                name: 'ZEROX',
                desc: 'پلتفرم تخصصی گیم و اخبار',
                link: 'https://zeroxgame74-afk.github.io/zeroxgamee/',
                img: 'https://uploadkon.ir/uploads/511301_26Zerox-۱۲۱۲.jpg'
            }, {
                name: 'کالفود',
                desc: 'پلتفرم سفارش غذای لذیذ',
                link: 'https://zeroxgame74-afk.github.io/call-food.ir/',
                img: 'https://uploadkon.ir/uploads/481d01_26call-food-۱۲۱۲۳.jpg'
            }, {

        // ============================================================
        //  تابع دریافت پاسخ (با چندین گزینه)
        // ============================================================
        function getReply(input) {
            const text = input.trim();

            if (!text) {
                return `چیزی ننوشتی داداش! یه چیزی بپرس 😊`;
            }

            // ===== بررسی کلمات کلیدی =====
            const lower = text.toLowerCase();
            const words = lower.split(/\s+/);
            let foundKey = null;
            let bestMatch = 0;

            for (const word of words) {
                if (word.length < 2) continue;
                for (const key of Object.keys(allReplies)) {
                    if (word === key) {
                        foundKey = key;
                        break;
                    }
                    if (word.includes(key) || key.includes(word)) {
                        if (key.length >= word.length - 1) {
                            foundKey = key;
                            break;
                        }
                    }
                }
                if (foundKey) break;
            }

            if (!foundKey) {
                for (const key of Object.keys(allReplies)) {
                    if (lower.includes(key)) {
                        foundKey = key;
                        break;
                    }
                }
            }

            // ===== پاسخ با دیکشنری =====
            if (foundKey && allReplies[foundKey]) {
                const replies = allReplies[foundKey];
                const randomIndex = Math.floor(Math.random() * replies.length);
                let reply = replies[randomIndex];

                // ===== سایت‌ها (فرمت کامل) =====
                if (foundKey === 'سایت') {

        // ============================================================
        //  تابع جستجوی اینترنت
        // ============================================================
        async function searchWeb(query) {
            try {
                // تلاش برای ویکی‌پدیا
                const response = await fetch(
                    `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`
                    );
                const data = await response.json();

                if (data.query && data.query.search && data.query.search.length > 0) {
                    const firstResult = data.query.search[0];
                    const pageId = firstResult.pageid;

                    // گرفتن خلاصه مقاله
                    const summaryResponse = await fetch(
                        `https://fa.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&pageids=${pageId}&format=json&origin=*`
                        );
                    const summaryData = await summaryResponse.json();
                    const extract = summaryData.query.pages[pageId].extract;

                    return `
                <div class="search-result">
                  <div class="result-title">🔍 نتیجه جستجو برای "<strong>${query}</strong>":</div>
                  <div class="result-desc">${extract.substring(0, 400)}${extract.length > 400 ? '...' : ''}</div>
                  <a href="https://fa.wikipedia.org/wiki/${encodeURIComponent(firstResult.title)}" target="_blank" class="result-link">
                    <i class="fas fa-external-link-alt"></i> ادامه مطلب در ویکی‌پدیا
                  </a>
                </div>
              `;
                } else {
                    // اگه ویکی‌پدیا پیدا نکرد، لینک گوگل
                    return `
                <div class="search-result" style="border-color:rgba(255,152,0,0.3);">
                  <div class="result-title">⚠️ "<strong>${query}</strong>" توی ویکی‌پدیا پیدا نشد.</div>
                  <div class="result-desc">
                    <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="result-link" style="margin-left:10px;">
                      <i class="fas fa-search"></i> جستجو در گوگل
                    </a>
                    <a href="https://www.google.com/search?q=${encodeURIComponent(query)}+معنی" target="_blank" class="result-link">
                      <i class="fas fa-book"></i> معنی در گوگل
                    </a>
                  </div>
                </div>
              `;
                }
            } catch (error) {
                // اگه اینترنت قطع بود
                return `
              <div class="search-result" style="border-color:rgba(255,107,107,0.3);">
                <div class="result-title">❌ خطا در اتصال به اینترنت!</div>
                <div class="result-desc">
                  یا اینترنت قطع هست یا مشکلی پیش اومده.<br><br>
                  <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="result-link">
                    <i class="fas fa-search"></i> جستجوی مستقیم در گوگل
                  </a>
                </div>
              </div>
            `;
            }
        }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = content;

            div.appendChild(avatar);
            div.appendChild(bubble);
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function showTyping() {
            let typing = document.querySelector('.typing-indicator');
            if (!typing) {
                typing = document.createElement('div');
                typing.className = 'typing-indicator';
                typing.innerHTML = '<i class="fas fa-robot"></i> دارم فکر میکنم...';
                messagesBox.appendChild(typing);
            }
            typing.classList.add('show');
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function hideTyping() {
            const typing = document.querySelector('.typing-indicator');
            if (typing) typing.classList.remove('show');
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('load', function() {
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });
    </script>

</body>
</html>
